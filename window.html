<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XRAY</title>
  <style>
    /* The panel declares its tokens on #xray-window-root and the theme class on a
       display:contents child of it, so custom properties never reach html/body —
       they inherit downward only. A frozen dark background therefore showed a
       dark slab (on load, on overscroll, behind translucent chrome) next to a
       light panel on a light preset.

       :has() lets the document read the theme back off the mounted subtree. The
       values below mirror the --xray-bg of each .xray-theme-* block in
       src/panel/styles.css (test/unit/themePresets.test.mjs keeps them in step);
       before the panel mounts, and for a custom theme, the XRAY Dark default. */
    :root { --xray-window-bg: #141517; }
    :root:has(.xray-theme-xray-dark) { --xray-window-bg: #141517; }
    :root:has(.xray-theme-xray-light) { --xray-window-bg: #f3f4f6; }
    :root:has(.xray-theme-github-dark) { --xray-window-bg: #0d1117; }
    :root:has(.xray-theme-github-light) { --xray-window-bg: #f6f8fa; }
    :root:has(.xray-theme-tokyo-night) { --xray-window-bg: #16161e; }
    :root:has(.xray-theme-catppuccin-mocha) { --xray-window-bg: #181825; }
    :root:has(.xray-theme-dracula) { --xray-window-bg: #21222c; }
    :root:has(.xray-theme-gruvbox-dark) { --xray-window-bg: #1d2021; }
    :root:has(.xray-theme-midnight) { --xray-window-bg: #000000; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--xray-window-bg);
    }

    #xray-window-root {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="xray-window-root"></div>
  <!-- Must load before the bundle (same order as manifest.json's ISOLATED list): storageBridge falls back to localStorage when
       window.XRAY_Store is missing, which silently cut the pop-out off from the
       rules, AI key, preferences and session every other surface shares. -->
  <script src="shared/utils.js"></script>
  <script src="shared/store.js"></script>
  <script src="shared/console-helpers.js"></script>
  <script src="dist/window-ui.js"></script>
</body>
</html>
