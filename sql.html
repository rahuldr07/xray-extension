<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XRAY SQL</title>
  <style>
    /* Same theme read-back as window.html: tokens live on the mounted subtree, so the
       document reads the active theme class off it with :has(). The values mirror the
       --xray-bg of each .xray-theme-* block in src/panel/styles.css; before mount and
       for a custom theme, the XRAY Dark default. */
    :root { --xray-window-bg: #141517; }
    :root:has(.xray-theme-xray-dark) { --xray-window-bg: #141517; }
    :root:has(.xray-theme-xray-light) { --xray-window-bg: #f3f4f6; }
    :root:has(.xray-theme-github-dark) { --xray-window-bg: #0d1117; }
    :root:has(.xray-theme-github-light) { --xray-window-bg: #f6f8fa; }
    :root:has(.xray-theme-tokyo-night) { --xray-window-bg: #16161e; }
    :root:has(.xray-theme-catppuccin-mocha) { --xray-window-bg: #181825; }
    :root:has(.xray-theme-dracula) { --xray-window-bg: #21222c; }
    :root:has(.xray-theme-gruvbox-dark) { --xray-window-bg: #1d2021; }
    :root:has(.xray-theme-midnight) { --xray-window-bg: #000000; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--xray-window-bg);
    }

    #xray-sql-root {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="xray-sql-root"></div>
  <!-- The store must load before the bundle, as in window.html: without window.XRAY_Store the
       page falls back to localStorage and loses the settings every other surface shares. -->
  <script src="shared/utils.js"></script>
  <script src="shared/store.js"></script>
  <script src="dist/sql-ui.js"></script>
</body>
</html>
