<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XRAY React Panel Preview</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #1e1e2e;
      color: #cdd6f4;
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    }
  </style>
</head>
<body>
  <div id="xray-preview-root"></div>
  <pre id="xray-preview-error" style="display:none;margin:16px;padding:16px;border:1px solid #f38ba8;border-radius:8px;color:#f38ba8;background:#181825;white-space:pre-wrap;"></pre>
  <script>
    window.XRAY_Console = {
      init() {},
      setContext(entry) {
        this.context = entry || null;
      },
      navigateHistory() {
        return null;
      },
      async execute(code) {
        const entry = this.context;
        if (code === 'res' || code === 'res.data') {
          return { type: 'object', result: entry?.responseDecrypted || null };
        }
        if (code === 'Object.keys(res)') {
          return { type: 'object', result: Object.keys(entry?.responseDecrypted || {}) };
        }
        if (code === 'schema(res)') {
          return { type: 'object', result: { branches: 'array', canCreatePullRequest: 'boolean', channel: 'string' } };
        }
        return { type: 'string', result: 'Preview command prepared: ' + code };
      },
    };
  </script>
  <script src="../dist/panel-ui.js"></script>
  <script>
    (async () => {
      const showError = (error) => {
        const target = document.getElementById('xray-preview-error');
        target.style.display = 'block';
        target.textContent = error && error.stack ? error.stack : String(error);
      };
      if (!window.XRAY_Panel) {
        showError('XRAY React bundle did not expose window.XRAY_Panel. Run npm run build and reload this file.');
        return;
      }
      await window.XRAY_Panel.init({
        mountEl: document.getElementById('xray-preview-root'),
        useShadow: false,
        devtoolsMode: true,
        clearMount: false,
      });
      window.XRAY_Panel.show();

      const now = Date.now();
      const paths = [
        ['/rahuldr07/xray-extension/branch-and-tag-count', 200, 429, 923],
        ['/rahuldr07/xray-extension/latest-commit', 200, 451, 1200],
        ['/rahuldr07/xray-extension/hovercards/citation/sidebar_partial', 204, 370, 0],
        ['/rahuldr07/xray-extension/contributors_list', 200, 369, 2600],
        ['/rahuldr07/xray-extension/recently-touched-branches', 200, 429, 206],
        ['/notifications/1179829401/watch_subscription', 200, 428, 1100],
        ['/rahuldr07/xray-extension/tree-commit-info', 200, 594, 13800],
        ['/rahuldr07/xray-extension/packages_list', 200, 477, 514],
        ['/github-copilot/chat', 500, 980, 7600],
        ['/github-copilot/chat/entitlement', 200, 461, 325],
      ];

      paths.forEach(([path, status, duration, size], index) => {
        window.XRAY_Panel.add({
          id: 'preview-' + index,
          type: 'api',
          method: index === 8 ? 'DELETE' : index === 3 ? 'POST' : 'GET',
          status,
          url: 'https://github.com' + path,
          urlPath: path,
          source: index % 2 ? 'xhr' : 'fetch',
          duration,
          size,
          timestamp: now + index * 1000,
          requestHeaders: { accept: 'application/json' },
          responseHeaders: { 'content-type': 'application/json' },
          responseDecrypted: {
            branches: [],
            canCreatePullRequest: true,
            channel: 'eyJjIjoi...preview',
            path,
            status,
          },
        });
      });

      window.XRAY_Panel.add({
        id: 'log-ready',
        type: 'log',
        logLevel: 'info',
        message: 'XRAY console ready',
        timestamp: now + 12000,
      });
      window.XRAY_Panel.selectEntryContext('preview-4');
      const tab = new URLSearchParams(location.search).get('tab');
      if (tab) window.XRAY_Panel.setActiveTab(tab);
    })().catch((error) => {
      const target = document.getElementById('xray-preview-error');
      target.style.display = 'block';
      target.textContent = error && error.stack ? error.stack : String(error);
    });
  </script>
</body>
</html>
