<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>XRAY Settings</title>
  <style>
    :root {
      --xr-bg: #09090b;
      --xr-surface: #18181b;
      --xr-surface-2: #27272a;
      --xr-border: #3f3f46;
      --xr-text: #e4e4e7;
      --xr-muted: #a1a1aa;
      --xr-ring: #6366f1;
      --xr-accent: #818cf8;
      --xr-success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top, #111827 0%, var(--xr-bg) 48%);
      color: var(--xr-text);
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 13px;
      min-width: 340px;
      min-height: 100vh;
      padding: 26px 16px;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 560px;
      background: rgba(24,24,27,.84);
      border: 1px solid var(--xr-border);
      border-radius: 12px;
      box-shadow: 0 14px 48px rgba(0,0,0,.42);
      backdrop-filter: blur(8px);
      overflow: hidden;
    }
    .head {
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--xr-border);
    }
    .head h1 {
      font-size: 15px;
      letter-spacing: .5px;
      font-weight: 700;
      color: #c7d2fe;
    }
    .head p {
      margin-top: 5px;
      color: var(--xr-muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .body {
      padding: 10px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .setting {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(63,63,70,.68);
    }
    .setting:last-child { border-bottom: none; }
    .setting label {
      color: #cbd5e1;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .6px;
      font-weight: 600;
    }
    select,
    input[type="number"] {
      width: 100%;
      background: var(--xr-surface-2);
      border: 1px solid var(--xr-border);
      border-radius: 8px;
      color: var(--xr-text);
      font: inherit;
      padding: 9px 11px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    select:focus,
    input[type="number"]:focus {
      border-color: var(--xr-ring);
      box-shadow: 0 0 0 3px rgba(99,102,241,.25);
    }
    .hint {
      color: var(--xr-muted);
      font-size: 11px;
      line-height: 1.45;
    }
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .switch-copy {
      color: var(--xr-text);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .1px;
    }
    .switch {
      position: relative;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }
    .switch-track {
      position: absolute;
      inset: 0;
      background: #3f3f46;
      border: 1px solid #52525b;
      border-radius: 999px;
      transition: background .2s, border-color .2s;
      cursor: pointer;
    }
    .switch-track::after {
      content: '';
      position: absolute;
      left: 2px;
      top: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #e4e4e7;
      transition: transform .2s;
    }
    .switch input:checked + .switch-track {
      background: rgba(99,102,241,.35);
      border-color: #818cf8;
    }
    .switch input:checked + .switch-track::after {
      transform: translateX(20px);
      background: #c7d2fe;
    }
    .save-btn {
      margin-top: 8px;
      border: none;
      border-radius: 9px;
      background: linear-gradient(180deg, #818cf8 0%, #6366f1 100%);
      color: white;
      font-weight: 700;
      cursor: pointer;
      padding: 10px 16px;
      transition: transform .12s, filter .12s;
    }
    .save-btn:hover { filter: brightness(1.05); transform: translateY(-1px); }
    .save-btn:active { transform: translateY(0); }
    .save-btn.is-saved {
      background: linear-gradient(180deg, #4ade80 0%, var(--xr-success) 100%);
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="head">
      <h1>⬡ XRAY Settings</h1>
      <p>Configure default panel behavior for all inspected tabs.</p>
    </header>
    <section class="body">
      <div class="setting">
        <label for="theme">Default Theme</label>
        <select id="theme">
          <option value="zinc">Zinc Dark (default)</option>
          <option value="mocha">Catppuccin Mocha</option>
          <option value="latte">Catppuccin Latte</option>
          <option value="dracula">Dracula</option>
          <option value="nord">Nord</option>
        </select>
      </div>

      <div class="setting">
        <label for="maxEntries">Max Stored Entries</label>
        <input type="number" id="maxEntries" value="500" min="50" max="10000" step="50">
        <div class="hint">Older entries are dropped when this limit is reached.</div>
      </div>

      <div class="setting">
        <label for="autoOpen">Behavior</label>
        <div class="switch-row">
          <div class="switch-copy">Auto-open panel on API capture</div>
          <label class="switch">
            <input type="checkbox" id="autoOpen">
            <span class="switch-track"></span>
          </label>
        </div>
      </div>

      <button class="save-btn" id="save">Save Settings</button>
    </section>
  </main>
  <script src="settings.js"></script>
</body>
</html>
