<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>XRAY Settings</title>
  <style>
    /* This is a top-level options document, not a shadow tree, so :root is the
       correct host for the tokens (the panel's :host rule would match nothing).
       The palette is the real --xray-* contract from src/panel/styles.css.

       Reflecting the saved theme: settings.js sets themeSelect.value from
       chrome.storage.local, which makes the matching <option> :checked, and the
       page CSP (script-src 'self') rules out an inline script. So the theme is
       read back declaratively with :has() — that also previews a theme the
       moment it is picked, before Save. Values mirror each preset's
       .xray-theme-* block in src/panel/styles.css, accent included (a preset
       owns its accent); test/unit/settingsContent.test.mjs keeps them in step.
       :root is XRAY Dark, the default. */
    :root {
      --xray-bg: #141517;
      --xray-surface: #1b1c1f;
      --xray-surface2: #25272a;
      --xray-text: #eeeff1;
      --xray-subtext: #bcbfc5;
      --xray-hint: #90949b;
      --xray-accent: #3dc8f5;
      --xray-green: #65d68a;
      --xray-border: #34363a;
      --xray-radius: 10px;
      --xray-radius-sm: calc(var(--xray-radius) * 0.6);
      --xray-radius-lg: calc(var(--xray-radius) * 1.4);
      --xray-font: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    }
    /* 'custom' has no static palette here — its colors live in storage and only
       the panel resolves them — so it stays on the XRAY Dark default. */
    :root:has(#theme option[value="xray-light"]:checked) {
      --xray-bg: #f3f4f6;
      --xray-surface: #ffffff;
      --xray-surface2: #eaecef;
      --xray-text: #16171a;
      --xray-subtext: #4b4f55;
      --xray-hint: #646971;
      --xray-accent: #00698f;
      --xray-green: #007138;
      --xray-border: #d7d9dd;
    }
    :root:has(#theme option[value="github-dark"]:checked) {
      --xray-bg: #0d1117;
      --xray-surface: #161b22;
      --xray-surface2: #21262d;
      --xray-text: #e6edf3;
      --xray-subtext: #c9d1d9;
      --xray-hint: #8a939d;
      --xray-accent: #5297ff;
      --xray-green: #3fb950;
      --xray-border: #30363d;
    }
    :root:has(#theme option[value="github-light"]:checked) {
      --xray-bg: #f6f8fa;
      --xray-surface: #ffffff;
      --xray-surface2: #eaeef2;
      --xray-text: #1f2328;
      --xray-subtext: #424a53;
      --xray-hint: #646c75;
      --xray-accent: #005eca;
      --xray-green: #00722b;
      --xray-border: #d0d7de;
    }
    :root:has(#theme option[value="tokyo-night"]:checked) {
      --xray-bg: #16161e;
      --xray-surface: #1a1b26;
      --xray-surface2: #292e42;
      --xray-text: #c0caf5;
      --xray-subtext: #a9b1d6;
      --xray-hint: #9094b2;
      --xray-accent: #7ba4f9;
      --xray-green: #9ece6a;
      --xray-border: #101014;
    }
    :root:has(#theme option[value="catppuccin-mocha"]:checked) {
      --xray-bg: #181825;
      --xray-surface: #1e1e2e;
      --xray-surface2: #313244;
      --xray-text: #cdd6f4;
      --xray-subtext: #a6adc8;
      --xray-hint: #959ab3;
      --xray-accent: #cba6f7;
      --xray-green: #a6e3a1;
      --xray-border: #45475a;
    }
    :root:has(#theme option[value="dracula"]:checked) {
      --xray-bg: #21222c;
      --xray-surface: #282a36;
      --xray-surface2: #343746;
      --xray-text: #f8f8f2;
      --xray-subtext: #adb5cb;
      --xray-hint: #8d9fd4;
      --xray-accent: #c59dff;
      --xray-green: #50fa7b;
      --xray-border: #424450;
    }
    :root:has(#theme option[value="gruvbox-dark"]:checked) {
      --xray-bg: #1d2021;
      --xray-surface: #282828;
      --xray-surface2: #3c3836;
      --xray-text: #ebdbb2;
      --xray-subtext: #bdae93;
      --xray-hint: #afa08b;
      --xray-accent: #8ec07c;
      --xray-green: #b8bb26;
      --xray-border: #504945;
    }
    :root:has(#theme option[value="midnight"]:checked) {
      --xray-bg: #000000;
      --xray-surface: #101010;
      --xray-surface2: #1d1d1d;
      --xray-text: #ffffff;
      --xray-subtext: #eeeeee;
      --xray-hint: #c8c8c8;
      --xray-accent: #00e5ff;
      --xray-green: #75e6a8;
      --xray-border: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background:
        radial-gradient(circle at top, color-mix(in srgb, var(--xray-accent) 12%, transparent) 0%, transparent 48%),
        var(--xray-bg);
      color: var(--xray-text);
      font-family: var(--xray-font);
      font-size: 13px;
      min-width: 340px;
      min-height: 100vh;
      padding: 26px 16px;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 560px;
      background: color-mix(in srgb, var(--xray-surface) 84%, transparent);
      border: 1px solid var(--xray-border);
      border-radius: var(--xray-radius-lg);
      box-shadow: 0 14px 48px rgba(0, 0, 0, .28);
      backdrop-filter: blur(8px);
      overflow: hidden;
    }
    .head {
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--xray-border);
    }
    .head h1 {
      font-size: 15px;
      letter-spacing: .5px;
      font-weight: 700;
      color: var(--xray-accent);
    }
    .head p {
      margin-top: 5px;
      color: var(--xray-subtext);
      font-size: 12px;
      line-height: 1.5;
    }
    .body {
      padding: 10px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .setting {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 10px 0;
      border-bottom: 1px solid color-mix(in srgb, var(--xray-hint) 32%, transparent);
    }
    .setting:last-child { border-bottom: none; }
    .setting label {
      color: var(--xray-subtext);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .6px;
      font-weight: 600;
    }
    select,
    input[type="number"] {
      width: 100%;
      background: var(--xray-surface2);
      border: 1px solid var(--xray-border);
      border-radius: var(--xray-radius);
      color: var(--xray-text);
      font: inherit;
      padding: 9px 11px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    select:focus,
    input[type="number"]:focus {
      border-color: var(--xray-accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--xray-accent) 25%, transparent);
    }
    .hint {
      color: var(--xray-hint);
      font-size: 11px;
      line-height: 1.45;
    }
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .switch-copy {
      color: var(--xray-text);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .1px;
    }
    .switch {
      position: relative;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }
    .switch-track {
      position: absolute;
      inset: 0;
      background: var(--xray-surface2);
      border: 1px solid var(--xray-border);
      border-radius: 999px;
      transition: background .2s, border-color .2s;
      cursor: pointer;
    }
    .switch-track::after {
      content: '';
      position: absolute;
      left: 2px;
      top: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--xray-hint);
      transition: transform .2s, background .2s;
    }
    .switch input:checked + .switch-track {
      background: var(--xray-accent);
      border-color: var(--xray-accent);
    }
    .switch input:checked + .switch-track::after {
      transform: translateX(20px);
      /* The track is the accent, which is light on the dark themes and a deep
         ink on the light ones, so pin the knob to --xray-bg: it inverts with the
         theme and stays legible against the filled track either way. */
      background: var(--xray-bg);
    }
    .save-btn {
      margin-top: 8px;
      border: none;
      border-radius: var(--xray-radius);
      background: var(--xray-accent);
      color: var(--xray-bg);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      padding: 10px 16px;
      transition: transform .12s, filter .12s;
    }
    .save-btn:hover { filter: brightness(1.05); transform: translateY(-1px); }
    .save-btn:active { transform: translateY(0); }
    .save-btn:focus-visible {
      outline: 2px solid var(--xray-text);
      outline-offset: 2px;
    }
    .save-btn.is-saved {
      background: var(--xray-green);
      color: var(--xray-bg);
    }

    /* The panel honours prefers-reduced-motion; this page did not. */
    @media (prefers-reduced-motion: reduce) {
      select,
      input[type="number"],
      .switch-track,
      .switch-track::after,
      .save-btn {
        transition: none;
      }
      .save-btn:hover,
      .save-btn:active { transform: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="head">
      <h1>⬡ XRAY Settings</h1>
      <p>These preferences are shared with the in-page panel, DevTools tab, and pop-out window.</p>
    </header>
    <section class="body">
      <div class="setting">
        <label for="theme">Theme</label>
        <!-- Options come from settings.js (its copy of the panel's THEME_PRESETS). -->
        <select id="theme"></select>
      </div>

      <div class="setting">
        <label for="accent">Accent</label>
        <select id="accent">
          <option value="theme">Theme accent (default)</option>
          <option value="blue">Amber</option>
          <option value="mauve">Lavender</option>
          <option value="teal">Teal</option>
          <option value="green">Green</option>
          <option value="peach">Gold</option>
          <option value="coral">Coral</option>
        </select>
      </div>

      <div class="setting">
        <label for="font">Font stack</label>
        <select id="font">
          <option value="jetbrains">JetBrains Mono (default)</option>
          <option value="cascadia">Cascadia Code</option>
          <option value="iosevka">Iosevka</option>
          <option value="system">System monospace</option>
        </select>
      </div>

      <div class="setting">
        <label for="density">Density</label>
        <select id="density">
          <option value="compact">Compact (default)</option>
          <option value="comfortable">Comfortable</option>
          <option value="spacious">Spacious</option>
        </select>
      </div>

      <div class="setting">
        <label for="maxEntries">Max Stored Entries</label>
        <input type="number" id="maxEntries" value="1000" min="50" max="5000" step="50">
        <div class="hint">Older entries are dropped when this limit is reached.</div>
      </div>

      <div class="setting">
        <label for="slowThreshold">Slow request threshold (ms)</label>
        <input type="number" id="slowThreshold" value="500" min="100" max="5000" step="50">
        <div class="hint">Requests above this duration are flagged as slow.</div>
      </div>

      <div class="setting">
        <label>Capture</label>
        <div class="switch-row">
          <div class="switch-copy">Intercept fetch() requests</div>
          <label class="switch">
            <input type="checkbox" id="captureFetch" checked>
            <span class="switch-track"></span>
          </label>
        </div>
        <div class="switch-row">
          <div class="switch-copy">Intercept XMLHttpRequest calls</div>
          <label class="switch">
            <input type="checkbox" id="captureXhr" checked>
            <span class="switch-track"></span>
          </label>
        </div>
      </div>

      <button class="save-btn" id="save">Save Settings</button>
    </section>
  </main>
  <script src="settings.js"></script>
</body>
</html>
