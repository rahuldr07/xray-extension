<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>XRAY Settings</title>
  <style>
    /* This is a top-level options document, not a shadow tree, so :root is the
       correct host for the tokens (the panel's :host rule would match nothing).
       The palette is the real --xray-* contract from src/panel/styles.css, not
       the zinc/indigo --xr-* set this page used to carry.

       Reflecting the saved theme: settings.js sets themeSelect.value from
       chrome.storage.local, which makes the matching <option> :checked, and the
       page CSP (script-src 'self') rules out an inline script. So the theme is
       read back declaratively with :has() — that also previews a theme the
       moment it is picked, before Save. Values mirror the .xray-theme-* blocks
       in src/panel/styles.css; keep them in step. */
    :root {
      --xray-bg: #0b0f14;
      --xray-surface: #101720;
      --xray-surface2: #151f2b;
      --xray-text: #d8e2ef;
      --xray-subtext: #8fa1b7;
      --xray-hint: #536274;
      --xray-blue: #37d5ff;
      --xray-green: #38f29b;
      --xray-border: rgba(80, 114, 148, .42);
      --xray-radius: 10px;
      --xray-radius-sm: calc(var(--xray-radius) * 0.6);
      --xray-radius-lg: calc(var(--xray-radius) * 1.4);
      --xray-font: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    }
    /* 'custom' has no static palette here — its colors live in storage and only
       the panel resolves them — so it stays on the Operator default. */
    :root:has(#theme option[value="dev-edition"]:checked) {
      --xray-bg: #11131f;
      --xray-surface: #171a2b;
      --xray-surface2: #20243a;
      --xray-text: #e1e7ff;
      --xray-subtext: #a8b0cf;
      --xray-hint: #6f789d;
      --xray-blue: #75ddff;
      --xray-green: #62e6a8;
      --xray-border: rgba(124, 138, 189, .36);
    }
    :root:has(#theme option[value="midnight"]:checked) {
      --xray-bg: #05070a;
      --xray-surface: #090d12;
      --xray-surface2: #0f151d;
      --xray-text: #d7f7ff;
      --xray-subtext: #83a4ad;
      --xray-hint: #49626b;
      --xray-blue: #00e5ff;
      --xray-green: #00ff95;
      --xray-border: rgba(0, 229, 255, .28);
    }
    :root:has(#theme option[value="light-lab"]:checked) {
      --xray-bg: #edf3fb;
      --xray-surface: #f8fbff;
      --xray-surface2: #e6eef9;
      --xray-text: #172033;
      --xray-subtext: #526173;
      --xray-hint: #75869a;
      --xray-blue: #006adc;
      --xray-green: #087f5b;
      --xray-border: rgba(82, 97, 115, .28);
    }
    :root:has(#theme option[value="claude"]:checked) {
      --xray-bg: #f0eee6;
      --xray-surface: #faf9f5;
      --xray-surface2: #eceae0;
      --xray-text: #23221f;
      --xray-subtext: #6b675f;
      --xray-hint: #9a968c;
      --xray-blue: #4a6fa5;
      --xray-green: #3f8a4f;
      --xray-border: rgba(60, 55, 48, .18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background:
        radial-gradient(circle at top, color-mix(in srgb, var(--xray-blue) 12%, transparent) 0%, transparent 48%),
        var(--xray-bg);
      color: var(--xray-text);
      font-family: var(--xray-font);
      font-size: 13px;
      min-width: 340px;
      min-height: 100vh;
      padding: 26px 16px;
      display: flex;
      justify-content: center;
    }
    .app {
      width: 100%;
      max-width: 560px;
      background: color-mix(in srgb, var(--xray-surface) 84%, transparent);
      border: 1px solid var(--xray-border);
      border-radius: var(--xray-radius-lg);
      box-shadow: 0 14px 48px rgba(0, 0, 0, .28);
      backdrop-filter: blur(8px);
      overflow: hidden;
    }
    .head {
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--xray-border);
    }
    .head h1 {
      font-size: 15px;
      letter-spacing: .5px;
      font-weight: 700;
      color: var(--xray-blue);
    }
    .head p {
      margin-top: 5px;
      color: var(--xray-subtext);
      font-size: 12px;
      line-height: 1.5;
    }
    .body {
      padding: 10px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .setting {
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding: 10px 0;
      border-bottom: 1px solid color-mix(in srgb, var(--xray-hint) 32%, transparent);
    }
    .setting:last-child { border-bottom: none; }
    .setting label {
      color: var(--xray-subtext);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .6px;
      font-weight: 600;
    }
    select,
    input[type="number"] {
      width: 100%;
      background: var(--xray-surface2);
      border: 1px solid var(--xray-border);
      border-radius: var(--xray-radius);
      color: var(--xray-text);
      font: inherit;
      padding: 9px 11px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    select:focus,
    input[type="number"]:focus {
      border-color: var(--xray-blue);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--xray-blue) 25%, transparent);
    }
    .hint {
      color: var(--xray-hint);
      font-size: 11px;
      line-height: 1.45;
    }
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .switch-copy {
      color: var(--xray-text);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .1px;
    }
    .switch {
      position: relative;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }
    .switch-track {
      position: absolute;
      inset: 0;
      background: var(--xray-surface2);
      border: 1px solid var(--xray-border);
      border-radius: 999px;
      transition: background .2s, border-color .2s;
      cursor: pointer;
    }
    .switch-track::after {
      content: '';
      position: absolute;
      left: 2px;
      top: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--xray-hint);
      transition: transform .2s, background .2s;
    }
    .switch input:checked + .switch-track {
      background: var(--xray-blue);
      border-color: var(--xray-blue);
    }
    .switch input:checked + .switch-track::after {
      transform: translateX(20px);
      /* The track is --xray-blue, which is a light pastel on the dark themes and
         a deep ink on the light ones, so pin the knob to --xray-bg: it inverts
         with the theme and stays legible against the filled track either way. */
      background: var(--xray-bg);
    }
    .save-btn {
      margin-top: 8px;
      border: none;
      border-radius: var(--xray-radius);
      background: var(--xray-blue);
      color: var(--xray-bg);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      padding: 10px 16px;
      transition: transform .12s, filter .12s;
    }
    .save-btn:hover { filter: brightness(1.05); transform: translateY(-1px); }
    .save-btn:active { transform: translateY(0); }
    .save-btn:focus-visible {
      outline: 2px solid var(--xray-text);
      outline-offset: 2px;
    }
    .save-btn.is-saved {
      background: var(--xray-green);
      color: var(--xray-bg);
    }

    /* The panel honours prefers-reduced-motion; this page did not. */
    @media (prefers-reduced-motion: reduce) {
      select,
      input[type="number"],
      .switch-track,
      .switch-track::after,
      .save-btn {
        transition: none;
      }
      .save-btn:hover,
      .save-btn:active { transform: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="head">
      <h1>⬡ XRAY Settings</h1>
      <p>These preferences are shared with the in-page panel, DevTools tab, and pop-out window.</p>
    </header>
    <section class="body">
      <div class="setting">
        <label for="theme">Theme</label>
        <select id="theme">
          <option value="operator">Operator (default)</option>
          <option value="dev-edition">Dev Edition</option>
          <option value="midnight">Midnight</option>
          <option value="light-lab">Light Lab</option>
          <option value="claude">Claude</option>
          <option value="custom">Custom (Theme Studio)</option>
        </select>
      </div>

      <div class="setting">
        <label for="accent">Accent</label>
        <select id="accent">
          <option value="blue">Blue (default)</option>
          <option value="mauve">Mauve</option>
          <option value="teal">Teal</option>
          <option value="green">Green</option>
          <option value="peach">Peach</option>
          <option value="coral">Coral</option>
        </select>
      </div>

      <div class="setting">
        <label for="font">Font stack</label>
        <select id="font">
          <option value="jetbrains">JetBrains Mono (default)</option>
          <option value="cascadia">Cascadia Code</option>
          <option value="iosevka">Iosevka</option>
          <option value="system">System monospace</option>
        </select>
      </div>

      <div class="setting">
        <label for="density">Density</label>
        <select id="density">
          <option value="compact">Compact (default)</option>
          <option value="comfortable">Comfortable</option>
          <option value="spacious">Spacious</option>
        </select>
      </div>

      <div class="setting">
        <label for="maxEntries">Max Stored Entries</label>
        <input type="number" id="maxEntries" value="1000" min="50" max="5000" step="50">
        <div class="hint">Older entries are dropped when this limit is reached.</div>
      </div>

      <div class="setting">
        <label for="slowThreshold">Slow request threshold (ms)</label>
        <input type="number" id="slowThreshold" value="500" min="100" max="5000" step="50">
        <div class="hint">Requests above this duration are flagged as slow.</div>
      </div>

      <div class="setting">
        <label>Capture</label>
        <div class="switch-row">
          <div class="switch-copy">Intercept fetch() requests</div>
          <label class="switch">
            <input type="checkbox" id="captureFetch" checked>
            <span class="switch-track"></span>
          </label>
        </div>
        <div class="switch-row">
          <div class="switch-copy">Intercept XMLHttpRequest calls</div>
          <label class="switch">
            <input type="checkbox" id="captureXhr" checked>
            <span class="switch-track"></span>
          </label>
        </div>
      </div>

      <button class="save-btn" id="save">Save Settings</button>
    </section>
  </main>
  <script src="settings.js"></script>
</body>
</html>
